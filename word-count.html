<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Count</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            color: #111827;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            line-height: 1.6;
        }
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .stats {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.75rem;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .stat-value {
            font-weight: 600;
            color: #111827;
        }
    </style>
</head>
<body>
    <h1>Word Count</h1>
    <textarea id="input" placeholder="Paste or type text here..." autofocus></textarea>
    <div class="stats">
        <div>Words: <span class="stat-value" id="words">0</span></div>
        <div>Characters: <span class="stat-value" id="chars">0</span></div>
        <div>Lines: <span class="stat-value" id="lines">0</span></div>
    </div>
    <script>
        const input = document.getElementById('input');
        const words = document.getElementById('words');
        const chars = document.getElementById('chars');
        const lines = document.getElementById('lines');

        function update() {
            const text = input.value;
            chars.textContent = text.length;
            words.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            lines.textContent = text ? text.split('\n').length : 0;
        }

        input.addEventListener('input', update);
    </script>
</body>
</html>
